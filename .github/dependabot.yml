version: 2

updates:
  # Base images. The hardened recipe pins Alpine and the PostgreSQL client
  # builders explicitly so a base move is a reviewable commit rather than a
  # silent change in a nightly rebuild.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    # Only the hardened recipe's bases are Dependabot's to move. The
    # upstream-compatible image is a mirror of an official pgAdmin release:
    # which release it tracks is decided by the publish workflow, which
    # resolves the newest stable tag, and the image is published once and
    # never patched afterwards. A bump here would also turn CI red on its own,
    # since ci.yml requires both recipes to pin the same version and nothing
    # moves the hardened one alongside it.
    ignore:
      - dependency-name: dpage/pgadmin4
    commit-message:
      prefix: "build(deps)"
    groups:
      container-routine-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-routine-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
