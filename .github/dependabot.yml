version: 2

updates:
  # Base images. The hardened recipe pins Alpine and the PostgreSQL client
  # builders explicitly so a base move is a reviewable commit rather than a
  # silent change in a nightly rebuild.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      container-routine-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-routine-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
