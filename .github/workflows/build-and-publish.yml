name: Build and publish pgAdmin image

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "pgAdmin version to build (for example 9.16)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: pgadmin

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve target version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.version || '' }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(
              curl -fsSL "https://registry.hub.docker.com/v2/repositories/dpage/pgadmin4/tags?page_size=100" \
                | jq -r '.results[].name' \
                | grep -E '^[0-9]+\.[0-9]+$' \
                | sort -V \
                | tail -n 1
            )"
          fi

          if [[ -z "${VERSION}" ]]; then
            echo "Could not determine a pgAdmin version" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Using version: ${VERSION}"

  build-and-push:
    needs: detect-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            VERSION=${{ needs.detect-version.outputs.version }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.detect-version.outputs.version }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.detect-version.outputs.version }}
