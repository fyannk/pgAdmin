name: Build and publish pgAdmin image variants

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "pgAdmin version to build (for example 9.16)"
        required: false
        type: string
      force_latest:
        description: "Move the latest tag even when the major version changes"
        required: false
        type: boolean
        default: false

concurrency:
  group: pgadmin-image-publish
  cancel-in-progress: false

# Nothing is granted by default; each job declares exactly what it needs.
permissions: {}

env:
  IMAGE_NAME: pgadmin
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/pgadmin

jobs:
  detect-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve target version
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          VERSION="$(.github/scripts/resolve-pgadmin-version.sh "${INPUT_VERSION}")"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Using version: ${VERSION}"

  build-and-push:
    needs: detect-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push images and signatures to GHCR
      id-token: write # keyless cosign signature and provenance attestation
      attestations: write # GitHub artifact attestations
    outputs:
      version: ${{ needs.detect-version.outputs.version }}
      hardened-digest: ${{ steps.build-hardened.outputs.digest }}
      upstream-digest: ${{ steps.build-upstream.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout matching pgAdmin source
        id: source
        env:
          VERSION: ${{ needs.detect-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported pgAdmin version: ${VERSION}" >&2
            exit 1
          fi

          source_ref="REL-${VERSION/./_}"
          git clone --depth 1 --branch "${source_ref}" \
            https://github.com/pgadmin-org/pgadmin4.git pgadmin4

          revision="$(git -C pgadmin4 rev-parse HEAD)"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "Building pgAdmin ${VERSION} from ${source_ref} (${revision})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check upstream-compatible image publication
        id: upstream
        env:
          REF: ${{ env.IMAGE_REPO }}:${{ needs.detect-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${REF}" >/dev/null 2>&1; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "${REF} already exists; skipping publish."
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            echo "${REF} is new; it will be published."
          fi

      - name: Build and push upstream-compatible image
        id: build-upstream
        if: steps.upstream.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.upstream
          build-args: |
            VERSION=${{ needs.detect-version.outputs.version }}
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ needs.detect-version.outputs.version }}

      - name: Attest and sign upstream-compatible image
        if: steps.upstream.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.build-upstream.outputs.digest }}
          push-to-registry: true

      - name: Cosign upstream-compatible image by digest
        if: steps.upstream.outputs.publish == 'true'
        env:
          DIGEST_REF: ${{ env.IMAGE_REPO }}@${{ steps.build-upstream.outputs.digest }}
        run: cosign sign --yes "${DIGEST_REF}"

      - name: Decide whether the hardened image needs a rebuild
        id: hardened
        env:
          LATEST_REF: ${{ env.IMAGE_REPO }}:latest
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
          RECIPE_REVISION: ${{ github.sha }}
          # Upper bound on staleness: rebuild anyway after this long so a PyPI
          # patch release with unchanged base images still gets picked up.
          MAX_IMAGE_AGE_DAYS: "7"
        shell: bash
        run: |
          set -euo pipefail

          # Each push of a mutable tag orphans the manifest it replaced, so only
          # rebuild when an input that actually changes the image has moved.
          bases=(
            python:3.15-alpine
            alpine:3.24
            postgres:14-alpine3.24
            postgres:15-alpine3.24
            postgres:16-alpine3.24
            postgres:17-alpine3.24
            postgres:18-alpine3.24
          )

          {
            echo "source=${SOURCE_REVISION}"
            echo "recipe=${RECIPE_REVISION}"
            for ref in "${bases[@]}"; do
              digest="$(docker buildx imagetools inspect "${ref}" --format '{{.Manifest.Digest}}')"
              echo "base=${ref}@${digest}"
            done
          } | tee /tmp/build-inputs.txt

          fingerprint="$(sha256sum /tmp/build-inputs.txt | cut -d' ' -f1)"
          echo "fingerprint=${fingerprint}" >> "${GITHUB_OUTPUT}"

          image_json="$(
            docker buildx imagetools inspect "${LATEST_REF}" \
              --format '{{ json .Image }}' 2>/dev/null || true
          )"

          published=""
          age_days=99999
          if [[ -n "${image_json}" ]]; then
            published="$(jq -r '.config.Labels["io.fyannk.pgadmin.inputs"] // empty' <<<"${image_json}")"
            created="$(jq -r '.created // empty' <<<"${image_json}")"
            if [[ -n "${created}" ]]; then
              age_days=$(( ( $(date -u +%s) - $(date -u -d "${created}" +%s) ) / 86400 ))
            fi
          fi

          echo "published fingerprint: ${published:-<none>}"
          echo "current fingerprint:   ${fingerprint}"
          echo "published age:         ${age_days} day(s)"

          if [[ "${published}" == "${fingerprint}" && "${age_days}" -lt "${MAX_IMAGE_AGE_DAYS}" ]]; then
            echo "rebuild=false" >> "${GITHUB_OUTPUT}"
            echo "No input changed and the published image is still fresh; skipping the push."
          else
            echo "rebuild=true" >> "${GITHUB_OUTPUT}"
            echo "Rebuilding."
          fi

      # latest is a promise to consumers that nothing breaking moved under
      # them. A new pgAdmin major (or a first publication) is a decision, so an
      # unattended run keeps latest where it is and only the version tags move.
      # A manual dispatch with force_latest is that decision.
      - name: Compute hardened tags
        id: tags
        if: steps.hardened.outputs.rebuild == 'true'
        env:
          VERSION: ${{ needs.detect-version.outputs.version }}
          FORCE_LATEST: ${{ inputs.force_latest || 'false' }}
          LATEST_REF: ${{ env.IMAGE_REPO }}:latest
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%d)"
          tags=(
            "${IMAGE_REPO}:${VERSION}-hardened"
            "${IMAGE_REPO}:${VERSION}-hardened-${stamp}"
          )

          previous="$(
            docker buildx imagetools inspect "${LATEST_REF}" \
              --format '{{ json .Image }}' 2>/dev/null \
              | jq -r '.config.Labels["org.opencontainers.image.version"] // empty' || true
          )"
          if [[ -z "${previous}" ]]; then
            echo "No published latest yet; it will be created."
            tags+=("${LATEST_REF}")
          elif [[ "${previous%%.*}" == "${VERSION%%.*}" || "${FORCE_LATEST}" == "true" ]]; then
            echo "latest moves from ${previous} to ${VERSION}."
            tags+=("${LATEST_REF}")
          else
            echo "::notice::Skipping latest: ${previous} -> ${VERSION} changes the major version. Dispatch with force_latest to move it."
          fi

          {
            echo "list<<EOF_TAGS"
            printf '%s\n' "${tags[@]}"
            echo "EOF_TAGS"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push hardened image
        id: build-hardened
        if: steps.hardened.outputs.rebuild == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./pgadmin4
          file: ./Dockerfile
          build-args: |
            VERSION=${{ needs.detect-version.outputs.version }}
            SOURCE_REVISION=${{ steps.source.outputs.revision }}
            BUILD_INPUTS=${{ steps.hardened.outputs.fingerprint }}
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.tags.outputs.list }}

      - name: Attest hardened image
        if: steps.hardened.outputs.rebuild == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.build-hardened.outputs.digest }}
          push-to-registry: true

      - name: Cosign hardened image by digest
        if: steps.hardened.outputs.rebuild == 'true'
        env:
          DIGEST_REF: ${{ env.IMAGE_REPO }}@${{ steps.build-hardened.outputs.digest }}
        run: cosign sign --yes "${DIGEST_REF}"

  # Scans what was actually pushed, by digest, after the registry accepted it.
  scan-published:
    name: Scan published digest
    needs: build-and-push
    if: needs.build-and-push.outputs.hardened-digest != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

      # Same cutoff as ci.yml: a fixable critical fails, everything else is
      # reported. The full inventory is kept as an artifact either way.
      - name: Scan the pushed digest
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
          TARGET: registry:${{ env.IMAGE_REPO }}@${{ needs.build-and-push.outputs.hardened-digest }}
        run: |
          set -euo pipefail
          "${GRYPE}" -q -o json "${TARGET}" > grype.json
          jq -r '.matches[] | "\(.vulnerability.severity)\t\(.vulnerability.fix.state)\t\(.vulnerability.id)\t\(.artifact.name)"' grype.json \
            | sort | uniq -c | sort -rn | head -40
          fixable="$(jq -r '[.matches[]
            | select(.vulnerability.severity == "Critical" and .vulnerability.fix.state == "fixed")
            | "\(.vulnerability.id) \(.artifact.name)"] | unique | .[]' grype.json)"
          if [[ -n "${fixable}" ]]; then
            echo "::error::Fixable criticals in the published image:"
            echo "${fixable}"
            exit 1
          fi
          echo "No fixable critical in the published digest."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: published-vulnerability-report
          path: grype.json
          retention-days: 14

  prune:
    name: Prune orphaned manifests
    needs: [build-and-push, scan-published]
    if: always() && needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Prune untagged manifests that no tagged index references. Do not enable
      # delete-ghost-images: it can delete tagged release versions.
      - name: Prune orphaned GHCR manifests
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: ${{ env.IMAGE_NAME }}
          delete-untagged: true
          validate: true
