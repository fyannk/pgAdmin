name: Scorecard

# OpenSSF Scorecard audits the repository's own supply-chain posture — pinned
# actions, token permissions, branch protection, release signing, dangerous
# workflow patterns — and publishes the result as a score. It is the check
# that notices when a later change quietly undoes one of them.
#
# The result is not uploaded to code scanning. Most of what Scorecard flags
# here is deliberate (base images follow their tags so the nightly rebuild
# picks up fixes; pgAdmin's requirements are re-resolved, not hash-pinned; a
# single maintainer merges without required approvals; there is nothing to
# fuzz), and as alerts those would sit open forever next to the image
# findings that need acting on. The score moves when posture does; the raw
# SARIF is kept as an artifact of each run.
on:
  # No branch_protection_rule trigger. It fires for classic branch protection
  # only, and this repository's protection is a ruleset — editing the ruleset
  # starts nothing, so the trigger would be dead config claiming a coverage it
  # does not have. There is no repository_ruleset workflow event to use
  # instead; the weekly run and the push runs are what catch posture drift.
  schedule:
    - cron: '45 5 * * 2'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  # The event is part of the key because the schedule and a push to main run
  # on the same ref. Without it they share a group and cancel-in-progress
  # lets one kill the other.
  group: scorecard-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Analyze repository posture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # publish the result to the OpenSSF API
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes to the OpenSSF REST API, which is what makes the badge
          # and the public score work. It uploads the score only — no source.
          publish_results: true

      - name: Retain the raw result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30
