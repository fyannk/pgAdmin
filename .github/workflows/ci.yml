name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HADOLINT_IMAGE: hadolint/hadolint:v2.14.0-alpine@sha256:7aba693c1442eb31c0b015c129697cb3b6cb7da589d85c7562f9deb435a6657c
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.9@sha256:a0383f60d92601e2694e24b24d37df7b6a40bed7cedbc447611c50009bf02d94

jobs:
  lint:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Workflow syntax
        run: |
          docker run --rm -v "${PWD}:/repo" -w /repo "${ACTIONLINT_IMAGE}" -color

      # Audits the workflows for injection, over-broad permissions, unpinned
      # actions and credential persistence. Offline so a fork pull request
      # without a token still gets the same answer.
      - name: Workflow security audit
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          online-audits: false

      - name: Dockerfile rules
        run: |
          # Suppressions and their rationale live in .hadolint.yaml.
          docker run --rm -v "${PWD}:/repo" -w /repo "${HADOLINT_IMAGE}" \
            hadolint Dockerfile Dockerfile.upstream

      - name: Shell scripts
        run: shellcheck .github/scripts/*.sh

      # The publish fingerprints the hardened image on the bases this reads
      # from the recipe; a recipe it cannot parse should fail here, not there.
      - name: Base images resolve from the recipes
        run: |
          set -euo pipefail
          .github/scripts/base-images.sh Dockerfile
          .github/scripts/base-images.sh Dockerfile.upstream

      - name: Resolve pgAdmin version
        id: version
        run: |
          set -euo pipefail
          # The same resolution the publish workflow uses, so CI tests the
          # release that actually ships rather than the recipes' ARG default.
          version="$(.github/scripts/resolve-pgadmin-version.sh)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: BuildKit checks
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The hardened recipe expects the pgAdmin source tree as its context,
          # so give the linter the real thing rather than this repository.
          git clone --depth 1 --branch "REL-${VERSION/./_}" \
            https://github.com/pgadmin-org/pgadmin4.git pgadmin4
          docker buildx build --check --build-arg VERSION="${VERSION}" -f Dockerfile.upstream .
          docker buildx build --check --build-arg VERSION="${VERSION}" -f Dockerfile ./pgadmin4
          docker buildx build --check --platform linux/arm64 --build-arg VERSION="${VERSION}" -f Dockerfile ./pgadmin4

  build:
    name: Build images
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out the matching pgAdmin source
        id: source
        run: |
          set -euo pipefail
          version="$(.github/scripts/resolve-pgadmin-version.sh)"
          git clone --depth 1 --branch "REL-${version/./_}" \
            https://github.com/pgadmin-org/pgadmin4.git pgadmin4
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "revision=$(git -C pgadmin4 rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      # Base images through Google's Docker Hub mirror, as in the publish,
      # so pull requests do not depend on Docker Hub's anonymous rate limit.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build upstream-compatible image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.upstream
          build-args: |
            VERSION=${{ steps.source.outputs.version }}
          push: false
          load: true
          tags: pgadmin-ci:upstream
          cache-from: type=gha,scope=upstream
          cache-to: type=gha,mode=max,scope=upstream

      - name: Upstream-compatible image keeps its guarantees
        run: .github/scripts/check-image.sh pgadmin-ci:upstream upstream

      - name: Build hardened image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./pgadmin4
          file: ./Dockerfile
          build-args: |
            VERSION=${{ steps.source.outputs.version }}
            SOURCE_REVISION=${{ steps.source.outputs.revision }}
            BUILD_INPUTS=ci
          push: false
          # Written straight to a tarball so the profile and scan jobs consume
          # the exact image this job produced rather than rebuilding it.
          outputs: type=docker,dest=/tmp/hardened.tar
          tags: pgadmin-ci:hardened
          cache-from: type=gha,scope=hardened
          cache-to: type=gha,mode=max,scope=hardened

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hardened-image
          path: /tmp/hardened.tar
          retention-days: 1
          compression-level: 6

  container:
    name: Restricted container profiles
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: hardened-image
          path: /tmp

      - name: Load the image under test
        run: docker load --input /tmp/hardened.tar

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The same checks the publish runs before it moves a tag.
      - name: Hardened image keeps its guarantees
        run: .github/scripts/check-image.sh pgadmin-ci:hardened hardened

  # The published images are amd64 only. This job measures whether the
  # hardened recipe builds under QEMU (the Python wheel compilation is the
  # expected bottleneck). It is informational until it is reliably green and
  # fast enough; only then add linux/arm64 to the publish.
  build-arm64:
    name: Build hardened image (arm64, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out the matching pgAdmin source
        id: source
        run: |
          set -euo pipefail
          version="$(.github/scripts/resolve-pgadmin-version.sh)"
          git clone --depth 1 --branch "REL-${version/./_}" \
            https://github.com/pgadmin-org/pgadmin4.git pgadmin4
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build for linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./pgadmin4
          file: ./Dockerfile
          platforms: linux/arm64
          build-args: |
            VERSION=${{ steps.source.outputs.version }}
            BUILD_INPUTS=ci-arm64
          push: false
          cache-from: type=gha,scope=hardened-arm64
          cache-to: type=gha,mode=max,scope=hardened-arm64

  scan:
    name: Vulnerability scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: hardened-image
          path: /tmp

      - name: Load the image under test
        run: docker load --input /tmp/hardened.tar

      # The cutoff is critical rather than high on purpose. "Has a fix" is not
      # the same as "this repository can apply it": grype reports the current
      # CPython advisories as fixed in 3.15 alphas and betas, and cryptography
      # as fixed a major above the version pgAdmin's requirements.txt pins.
      # Gating on those would leave the check permanently red for changes that
      # could never turn it green, which is how a required check gets ignored.
      # Everything below the cutoff still reaches the Security tab below.
      - name: Install grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

      # Only a fixable critical this change brings in fails the check. One that
      # is already in the published image appeared because an advisory was
      # filed, not because of this change, and failing every open pull request
      # for it would block unrelated work until someone fixes main. Those are
      # tracked instead by a single issue from image-watch.yml, and the nightly
      # rebuild clears them as soon as a fix can be applied. Both images are
      # scanned here with the same database, so the difference is what this
      # change put into the image, not when each image was scanned.
      - name: Fixable criticals introduced by this change
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
          BASELINE: ghcr.io/${{ github.repository_owner }}/pgadmin:latest
        run: |
          set -euo pipefail
          fixable='[.matches[]
            | select(.vulnerability.severity == "Critical" and .vulnerability.fix.state == "fixed")
            | "\(.vulnerability.id) \(.artifact.name)"] | unique | .[]'

          "${GRYPE}" -q -o json pgadmin-ci:hardened | jq -r "${fixable}" | sort > candidate.txt
          if "${GRYPE}" -q -o json "registry:${BASELINE}" > baseline.json; then
            jq -r "${fixable}" baseline.json | sort > baseline.txt
          else
            # Without a baseline nothing can be called pre-existing, so gate
            # on everything rather than let a finding through unchecked.
            echo "::warning::Could not scan ${BASELINE}; gating on every fixable critical"
            : > baseline.txt
          fi

          # Keyed on advisory and package, not version: bumping a package to
          # another still-vulnerable version is not a new finding.
          introduced="$(comm -23 candidate.txt baseline.txt)"
          existing="$(comm -12 candidate.txt baseline.txt)"

          if [[ -n "${existing}" ]]; then
            echo "::warning::Already in the published image, tracked by the image watch issue: $(tr '\n' ';' <<<"${existing}")"
          fi
          if [[ -n "${introduced}" ]]; then
            echo "Fixable criticals introduced by this change:"
            echo "${introduced}"
            exit 1
          fi
          echo "No fixable critical introduced by this change."

      # Only findings with a fix go to the Security tab, so it lists what a
      # rebuild or a recipe change can clear. Alpine and PyPI packages with no
      # fix yet would otherwise bury those under alerts nobody can act on; the
      # full inventory is in the SBOM attached to every published image.
      - name: Fixable findings
        if: always()
        id: full
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: pgadmin-ci:hardened
          fail-build: false
          only-fixed: true
          output-format: sarif

      - name: Publish to code scanning
        if: always() && steps.full.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: ${{ steps.full.outputs.sarif }}
          category: grype-hardened

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.full.outputs.sarif != ''
        with:
          name: vulnerability-report
          path: ${{ steps.full.outputs.sarif }}
          retention-days: 14
